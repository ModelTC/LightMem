[project]
name = "light-mem"
version = "0.1.0"
description = "kv cache in disk"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    'numpy>=1.25.1'
]

[project.scripts]
lightmem_server = "light_mem.server_cli:main"

[build-system]
requires = ["py-build-cmake~=0.4.3"]
build-backend = "lightmem_build_backend"
backend-path = ["."]

[tool.py-build-cmake.module]
name = "light_mem"
directory = "python"

[tool.py-build-cmake.sdist]
include = ["CMakeLists.txt", "src", "python", "lightmem_build_backend.py"]

[tool.py-build-cmake.cmake]
minimum_version = "3.24"
build_type = "Release"
build_args = ["-j512"]